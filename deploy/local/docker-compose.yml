# Foodera — Local installation (restaurant's own computer, works without internet).
# Usage: copy .env.example to .env, fill it in, then run install.ps1 (or: docker compose up -d --build).
name: foodera

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FooderaERP;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Database__MigrateOnStartup: "true"
      Deployment__Mode: Local
      Licensing__PublicKeyPem: ${LICENSE_PUBLIC_KEY}
      Jwt__Secret: ${JWT_SECRET}
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: ${SERVER_IP}:9000
      Minio__AccessKey: ${MINIO_USER}
      Minio__SecretKey: ${MINIO_PASSWORD}
      Minio__Bucket: foodera-files
      Minio__UseSSL: "false"
      Seed__SuperAdminUserName: ${ADMIN_USERNAME}
      Seed__SuperAdminEmail: ${ADMIN_EMAIL}
      Seed__SuperAdminPassword: ${ADMIN_PASSWORD}
      Seed__SuperAdminFullName: ${ADMIN_FULLNAME}
    ports:
      - "5167:5167"

  web:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  sqlserver_data:
  minio_data:
