services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: foodera-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin12345"
    ports:
      - "1435:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
  minio:
    image: minio/minio
    container_name: foodera-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Admin12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  sqlserver_data:
  minio_data: